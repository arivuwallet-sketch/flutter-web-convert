name: Validate converter and generated apps
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
  flutter:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: android
          - os: macos-latest
            platform: ios
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          cache: true
      - name: Generate a real test project
        run: node scripts/export-flutter.mjs .generated/flutter
        env:
          APP_NAME: Demo & Shop $5
          WEBSITE_URL: https://example.com
      - name: Bootstrap and analyze
        working-directory: .generated/flutter
        run: |
          bash tool/bootstrap.sh ${{ matrix.platform }}
          flutter pub get
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
          flutter analyze --no-fatal-infos
          flutter test
      - if: matrix.platform == 'android'
        working-directory: .generated/flutter
        run: flutter build apk --debug
      - if: matrix.platform == 'ios'
        working-directory: .generated/flutter
        run: flutter build ios --release --no-codesign
